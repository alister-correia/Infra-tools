<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMware Cloud Director Automation tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #21262d;
      --border:      #30363d;
      --text:        #e6edf3;
      --muted:       #8b949e;
      --vcd:         #58a6ff;
      --accent:      #238636;
      --ok:          #3fb950;
      --fail:        #f85149;
      --warn:        #d29922;
      --radius:      8px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .logo {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #f0883e, var(--vcd));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; flex-shrink: 0; }

    .header-selectors {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sel-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sel-group label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .sel-group select,
    .sel-group input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 4px 8px;
      outline: none;
    }
    .sel-group select { cursor: pointer; }
    .sel-group input[type="text"] { width: 130px; }
    .sel-group input[type="text"]::placeholder { color: var(--muted); }
    .sel-group select:focus,
    .sel-group input[type="text"]:focus { border-color: var(--vcd); }

    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }
    .autocomplete-list.open { display: block; }
    .autocomplete-item {
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
    }
    .autocomplete-item:hover,
    .autocomplete-item.highlighted { background: var(--border); }
    .autocomplete-item strong { color: var(--vcd); font-weight: 600; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-switch {
      position: relative;
      width: 34px; height: 18px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      left: 2px; top: 2px;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--vcd); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-logout:hover { border-color: var(--fail); color: var(--fail); }
    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-clear:hover { border-color: var(--warn); color: var(--warn); }

    /* ── Workspace ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 180px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-filter {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-filter input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.78rem;
      padding: 6px 8px;
      outline: none;
    }
    .sidebar-filter input:focus { border-color: var(--vcd); }
    .sidebar-filter input::placeholder { color: var(--muted); }

    .sidebar-tasks {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 4px;
    }
    .sidebar-tasks::-webkit-scrollbar { width: 3px; }
    .sidebar-tasks::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .task-group { }
    .task-group.hidden { display: none; }
    .task-group.collapsed .task-item { display: none; }

    .task-group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px 3px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
    }
    .task-group-header:hover { color: var(--text); }
    .task-group-icon { font-size: 0.75rem; }
    .task-group-chevron {
      margin-left: auto;
      font-size: 0.6rem;
      transition: transform 0.15s;
      line-height: 1;
    }
    .task-group.collapsed .task-group-chevron { transform: rotate(-90deg); }

    .task-item {
      padding: 6px 10px 6px 18px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .task-item:hover { background: var(--surface2); color: var(--text); }
    .task-item.active {
      background: rgba(88,166,255,0.08);
      color: var(--vcd);
      border-left-color: var(--vcd);
    }
    .task-item.hidden { display: none; }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }

    /* ── Main panel ── */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }
    .main-content::-webkit-scrollbar { width: 4px; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty state */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }
    .empty-state .e-arrow { font-size: 1.8rem; opacity: 0.25; }
    .empty-state .e-text { font-size: 0.88rem; }
    .empty-state .e-sub { font-size: 0.72rem; opacity: 0.5; }

    /* Task view */
    #taskView { display: none; }

    .task-view-header {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .task-view-header h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 3px; }
    .task-view-header p { font-size: 0.78rem; color: var(--muted); }

    /* Param form */
    .param-form {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .param-field { display: flex; flex-direction: column; gap: 4px; }
    .param-field label {
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .param-field select,
    .param-field input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 6px 10px;
      outline: none;
      min-width: 170px;
    }
    .param-field select:focus,
    .param-field input[type="text"]:focus { border-color: var(--vcd); }

    .param-auto { display: flex; flex-direction: column; gap: 4px; }
    .param-auto .param-lbl {
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .param-auto .param-val {
      font-size: 0.8rem;
      padding: 6px 10px;
      background: rgba(88,166,255,0.07);
      border: 1px solid rgba(88,166,255,0.2);
      border-radius: 6px;
      color: var(--vcd);
    }

    .run-btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 18px;
      transition: opacity 0.15s;
      white-space: nowrap;
      height: 32px;
    }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .run-btn.danger { background: #b91c1c; }

    /* Result area */
    .result-notice {
      padding: 10px 14px;
      border-left: 3px solid var(--muted);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .result-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-export-csv {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-export-csv:hover { border-color: var(--vcd); color: var(--vcd); }

    .btn-console {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-console:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
    .btn-console:disabled { opacity: 0.35; cursor: not-allowed; }

    .result-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--vcd);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-error {
      background: rgba(248,81,73,0.07);
      border: 1px solid rgba(248,81,73,0.25);
      border-radius: 6px;
      color: var(--fail);
      padding: 12px 16px;
      font-size: 0.82rem;
    }

    .result-ok {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(63,185,80,0.07);
      border: 1px solid rgba(63,185,80,0.25);
      border-radius: 6px;
      color: var(--ok);
      padding: 14px 18px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .empty-result {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 16px 0;
    }

    /* Table */
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .result-table th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .result-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(48,54,61,0.5);
      color: var(--text);
      vertical-align: middle;
    }
    .result-table tr:last-child td { border-bottom: none; }
    .result-table tr:hover td { background: rgba(33,38,45,0.6); }
    .result-table tr.rule-user td   { background: rgba(56,139,253,0.06); }
    .result-table tr.rule-system td { background: rgba(139,148,158,0.08); color: var(--muted); }
    .result-table tr.rule-user:hover td   { background: rgba(56,139,253,0.14); }
    .result-table tr.rule-system:hover td { background: rgba(139,148,158,0.18); }

    /* Status pill */
    .spill {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .spill-on  { background: rgba(63,185,80,0.1);  color: var(--ok);   border: 1px solid rgba(63,185,80,0.25); }
    .spill-off { background: rgba(248,81,73,0.1);  color: var(--fail); border: 1px solid rgba(248,81,73,0.25); }
    .spill-mid { background: rgba(139,148,158,0.1); color: var(--muted); border: 1px solid var(--border); }

    /* Detail card */
    .detail-card { display: flex; flex-direction: column; gap: 18px; }
    .detail-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .detail-item {}
    .detail-key {
      font-size: 0.64rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .detail-val {
      font-size: 0.82rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .detail-section {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding-top: 4px;
      padding-bottom: 6px;
      border-top: 1px solid var(--border);
    }

    /* ── Security banner ── */
    .security-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(210,153,34,0.08);
      border-bottom: 1px solid rgba(210,153,34,0.25);
      color: var(--warn);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 7px 18px;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }
    .security-banner .ban-icon { font-size: 0.85rem; }

    /* ── Login modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 34px;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .modal-card h2 { font-size: 1.05rem; font-weight: 700; }
    .modal-card p { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin-top: 4px; }

    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .form-field input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.875rem;
      padding: 9px 12px;
      outline: none;
      width: 100%;
    }
    .form-field input:focus { border-color: var(--vcd); }
    .form-field input::placeholder { color: var(--muted); }

    .form-error { font-size: 0.76rem; color: var(--fail); display: none; }
    .form-error.visible { display: block; }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 10px;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 8px;
      width: 100%;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--text); color: var(--text); }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<!-- Login modal -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal-card">
    <div>
      <h2>Sign in</h2>
      <p>VCD credentials are kept only for this browser tab.</p>
    </div>
    <div class="form-field">
      <label>VCD Username</label>
      <input id="loginUser" type="text" placeholder="user@domain.com" autocomplete="username" />
    </div>
    <div class="form-field">
      <label>VCD Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="form-error" id="loginError"></div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Continue</button>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay hidden" id="confirmOverlay">
  <div class="modal-card" style="max-width:340px">
    <h2 id="confirmTitle">Confirm Action</h2>
    <p id="confirmMsg"></p>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn-secondary" onclick="confirmResolve(false)">Cancel</button>
      <button class="btn-primary" style="background:#b91c1c" onclick="confirmResolve(true)">Confirm</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">V</div>
  <h1>VMware Cloud Director Automation tool</h1>

  <div class="header-selectors" id="headerSelectors" style="display:none">
    <div class="sel-group" id="envGroup" style="display:none">
      <label>Env</label>
      <select id="envSelect" onchange="switchEnvironment(this.value)">
        <option value="">— select —</option>
      </select>
    </div>

    <div class="sel-group">
      <label>Org</label>
      <div class="autocomplete-wrap">
        <input id="orgInput" type="text" placeholder="Search org…" autocomplete="off" />
        <div class="autocomplete-list" id="orgDropdown"></div>
      </div>
    </div>

    <div class="sel-group" id="vdcGroup" style="display:none">
      <label>VDC</label>
      <div class="autocomplete-wrap">
        <input id="vdcInput" type="text" placeholder="Search VDC…" autocomplete="off" />
        <div class="autocomplete-list" id="vdcDropdown"></div>
      </div>
    </div>
  </div>

  <div class="header-right">
    <button class="btn-clear" onclick="clearSession()" title="Clear org/VDC selection">Clear session</button>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</header>

<div class="workspace">
  <aside class="sidebar">
    <div class="sidebar-filter">
      <input type="text" id="taskFilter" placeholder="🔍 Filter tasks…" oninput="filterTasks(this.value)" />
    </div>
    <div class="sidebar-tasks" id="sidebarTasks"></div>
    <div class="sidebar-footer">
    </div>
  </aside>

  <div class="main-panel">
    <div class="security-banner">
      <span class="ban-icon">🔒</span>
      This tool does not permit deletion of any resources. Only read and create operations are available.
    </div>
    <div class="main-content" id="mainContent">
      <div class="empty-state" id="emptyState">
        <div class="e-arrow">←</div>
        <div class="e-text">Select a task from the sidebar</div>
        <div class="e-sub">Select an Org and VDC first</div>
      </div>
      <div id="taskView">
        <div class="task-view-header">
          <h2 id="taskTitle"></h2>
          <p id="taskDesc"></p>
        </div>
        <div class="param-form" id="paramForm"></div>
        <div id="resultArea"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ── Task definitions ───────────────────────────────────────────────────────
const enc = s => encodeURIComponent(s);

const TASKS = [
  // COMPUTE
  { id:'list_vms', label:'List all VMs', cat:'COMPUTE', icon:'⚡',
    desc:'All VMs in the VDC with power state, CPU, and RAM.',
    params:[],
    run: () => apiFetch('/api/tasks/vms'),
    render: renderVmTable },

  { id:'powered_off', label:'Powered-off VMs', cat:'COMPUTE', icon:'⚡',
    desc:'VMs currently in a powered-off state.',

// ── Auth helpers ───────────────────────────────────────────────────────────
function authHeaders() {
  return {
    'Content-Type':   'application/json',
    'X-VCD-Username': sessionStorage.getItem('vcd_username') || '',
    'X-VCD-Password': sessionStorage.getItem('vcd_password') || '',
    'X-VCD-Org':      sessionStorage.getItem('vcd_org')      || '',
    'X-VCD-Org-Id':   sessionStorage.getItem('vcd_org_id')   || '',
    'X-VCD-VDC-Id':   sessionStorage.getItem('vcd_vdc_id')   || '',
    'X-VCD-VDC-Name': sessionStorage.getItem('vcd_vdc_name') || '',
  };
}

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { ...authHeaders(), ...(opts.headers||{}) } });
  if (!res.ok) {
    let msg = 'Request failed';
    try { msg = (await res.json()).detail || msg; } catch (_) {}
    const err = new Error(msg);
    err.status = res.status;
    err.detail = msg;
    throw err;
  }
  return res.json();
}

// ── Login ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');

  if (!user || !pass) {
    errEl.textContent = 'Both fields are required.';
    errEl.classList.add('visible');
    return;
  }
  errEl.classList.remove('visible');
  btn.textContent = 'Verifying…';
  btn.disabled = true;

  try {
    const res = await fetch('/api/vcd/verify', {
      headers: { 'Content-Type':'application/json', 'X-VCD-Username':user, 'X-VCD-Password':pass }
    });
    const data = await res.json();
    if (!data.ok) {
      errEl.textContent = `Auth failed: ${data.error || 'Invalid credentials'}`;
      errEl.classList.add('visible');
      btn.textContent = 'Continue';
      btn.disabled = false;
      return;
    }
  } catch (e) {
    errEl.textContent = 'Cannot reach server. Is the backend running?';
    errEl.classList.add('visible');
    btn.textContent = 'Continue';
    btn.disabled = false;
    return;
  }

  sessionStorage.setItem('vcd_username', user);
  sessionStorage.setItem('vcd_password', pass);
  btn.textContent = 'Continue';
  btn.disabled = false;
  document.getElementById('loginOverlay').classList.add('hidden');

// ── Org autocomplete ───────────────────────────────────────────────────────
async function loadOrgs() {
  try {
    const orgs = await apiFetch('/api/vcd/orgs');
    orgList = orgs.map(o => ({ id:o.id, name:o.name }));
  } catch (_) {}
}

function renderOrgDropdown(q) {
  const dd = document.getElementById('orgDropdown');
  const matches = q ? orgList.filter(o => o.name.toLowerCase().includes(q.toLowerCase())) : orgList;
  if (!matches.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = matches.map(o => {
    const i = o.name.toLowerCase().indexOf(q.toLowerCase());
    const lbl = q && i !== -1
      ? o.name.slice(0,i) + '<strong>' + o.name.slice(i,i+q.length) + '</strong>' + o.name.slice(i+q.length)
      : o.name;
    return `<div class="autocomplete-item" data-value="${o.name}" data-id="${o.id}">${lbl}</div>`;
  }).join('');
  dd.classList.add('open');
  orgHighlight = -1;
}

function closeOrgDropdown() { document.getElementById('orgDropdown').classList.remove('open'); orgHighlight = -1; }

function switchOrg(name, id) {
  if (!name) return;
  sessionStorage.setItem('vcd_org', name);
  sessionStorage.setItem('vcd_org_id', id || '');
  sessionStorage.removeItem('vcd_vdc_id');
  document.getElementById('orgInput').value = name;
  closeOrgDropdown();
  vdcList = [];
  document.getElementById('vdcInput').value = '';
  document.getElementById('vdcGroup').style.display = 'none';
  loadVdcs();
}

const orgInput = document.getElementById('orgInput');
orgInput.addEventListener('focus', () => renderOrgDropdown(orgInput.value));
orgInput.addEventListener('input', () => { orgHighlight=-1; renderOrgDropdown(orgInput.value); });
orgInput.addEventListener('keydown', e => {
  const items = document.getElementById('orgDropdown').querySelectorAll('.autocomplete-item');
  if (e.key==='ArrowDown') { e.preventDefault(); orgHighlight=Math.min(orgHighlight+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('highlighted',i===orgHighlight)); }
  else if (e.key==='ArrowUp') { e.preventDefault(); orgHighlight=Math.max(orgHighlight-1,-1); items.forEach((el,i)=>el.classList.toggle('highlighted',i===orgHighlight)); }
  else if (e.key==='Enter') { e.preventDefault(); const h=document.getElementById('orgDropdown').querySelector('.highlighted'); if(h) switchOrg(h.dataset.value, h.dataset.id); }
  else if (e.key==='Escape') closeOrgDropdown();
});
document.getElementById('orgDropdown').addEventListener('click', e => {
  const item = e.target.closest('.autocomplete-item');
  if (item) switchOrg(item.dataset.value, item.dataset.id);
});

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  const container = document.getElementById('sidebarTasks');
  container.innerHTML = CATEGORIES.map(cat => {
    const items = TASKS.filter(t => t.cat === cat.id);
    return `
      <div class="task-group collapsed" data-cat="${cat.id}">
        <div class="task-group-header" onclick="toggleCategory('${cat.id}')">
          <span class="task-group-icon">${cat.icon}</span>
          <span>${cat.label}</span>
          <span class="task-group-chevron">▼</span>
        </div>
        ${items.map(t => `
          <div class="task-item" data-id="${t.id}" onclick="selectTask('${t.id}')">${t.label}</div>
        `).join('')}
      </div>`;
  }).join('');
}

function toggleCategory(catId) {
  const group = document.querySelector(`.task-group[data-cat="${catId}"]`);
  if (group) group.classList.toggle('collapsed');
}

function filterTasks(q) {
  const query = q.toLowerCase().trim();
  document.querySelectorAll('.task-group').forEach(group => {
    let anyVisible = false;
    group.querySelectorAll('.task-item').forEach(item => {
      const match = !query || item.textContent.toLowerCase().includes(query);
      item.classList.toggle('hidden', !match);
      if (match) anyVisible = true;
    });
    group.classList.toggle('hidden', !anyVisible);
    // Auto-expand when filtering so results are visible
    if (query && anyVisible) group.classList.remove('collapsed');
  });
}

// ── Task selection ─────────────────────────────────────────────────────────
async function selectTask(taskId) {
  currentTask = taskId ? TASKS.find(t => t.id === taskId) : null;

  document.querySelectorAll('.task-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === taskId));

  const empty = document.getElementById('emptyState');
  const view  = document.getElementById('taskView');

  if (!currentTask) {
    empty.style.display = 'flex';
    view.style.display  = 'none';
    return;
  }

  empty.style.display = 'none';
  view.style.display  = 'block';
  document.getElementById('taskTitle').textContent = currentTask.label;
  document.getElementById('taskDesc').innerHTML    = currentTask.desc;
  document.getElementById('resultArea').innerHTML  = '';
  document.getElementById('paramForm').innerHTML   = '<div class="result-loading"><div class="spinner"></div><span>Loading…</span></div>';
  paramValues = {};
  taskOptions = {};

  if (!sessionStorage.getItem('vcd_org')) {
    document.getElementById('paramForm').innerHTML = '';
    document.getElementById('resultArea').innerHTML =
      '<div class="result-error">⚠ Select an organisation from the top bar before using this task.</div>';
    return;
  }

  await loadParamOptions(currentTask);
}

async function loadParamOptions(task) {
  for (const p of task.params) {
    try {
      if (p.type === 'vm-select') {
        const vms = await apiFetch('/api/tasks/vms');
        taskOptions[p.id] = vms.map(v => ({ value:v.name, label:`${v.name} — ${v.status||'?'}` }));
      } else if (p.type === 'vapp-select') {
        const vapps = await apiFetch('/api/tasks/vapps');
        taskOptions[p.id] = vapps.map(v => ({ value:v.name, label:`${v.name} — ${v.status||'?'}` }));
      } else if (p.type === 'network-select') {
        const nets = await apiFetch('/api/tasks/networks');
        const noneOpt = p.allowNone ? [{ value:'', label:'None' }] : [];
        taskOptions[p.id] = [...noneOpt, ...nets.map(n => ({ value:n.name, label:n.name }))];
      } else if (p.type === 'edge-select') {
        const gws = await apiFetch('/api/tasks/edge-gateways');
        taskOptions[p.id] = gws.map(g => ({
          value: g.id,
          label: `${g.name} [${g.backing_type||'NSX-T'}] — ${g.status||'?'}`,
        }));
      } else if (p.type === 'vdc-group-select') {
        const groups = await apiFetch('/api/tasks/vdc-groups');
        taskOptions[p.id] = groups.map(g => ({ value:g.id, label:g.name }));
      } else if (p.type === 'app-profile-select') {
        const gwParam = currentTask.params.find(q => q.type === 'edge-select');
        const gwId = gwParam ? paramValues[gwParam.id] : '';
        const profiles = gwId ? await apiFetch(`/api/tasks/app-port-profiles?gateway_id=${enc(gwId)}`) : [];
        taskOptions[p.id] = [{ value:'', label:'— custom (use protocol/ports below) —' },
          ...profiles.map(a => ({ value:a.id, label:`${a.name}${a.scope==='SYSTEM'?' ':'  '}` }))];
      } else if (p.type === 'vapp-or-new-select') {
        const vapps = await apiFetch('/api/tasks/vapps');
        taskOptions[p.id] = [
          { value:'__new__', label:'— New vApp —' },
          ...vapps.map(v => ({ value:v.name, label:v.name })),
        ];
        paramValues[p.id] = '__new__';
      } else if (p.type === 'vm-count-select') {
        taskOptions[p.id] = [1,2,3,4,5].map(n => ({ value:String(n), label:String(n) }));
        paramValues[p.id] = '1';
      } else if (p.type === 'multi-vm-banner') {
        taskOptions[p.id] = null;
      } else if (p.type === 'catalog-select') {
        const cats = await apiFetch('/api/tasks/catalogs');
        taskOptions[p.id] = cats.map(c => ({ value:c.name, label:c.name }));
      } else if (p.type === 'template-select') {
        taskOptions[p.id] = [{ value:'', label:'— select a catalog first —' }];
      } else if (p.type === 'disk-select') {
        const vmParam = task.params.find(q => q.type === 'vm-select');
        const preVm = vmParam ? paramValues[vmParam.id] : '';
        if (preVm) {
          const disks = await apiFetch(`/api/tasks/vm/disks?vm_name=${enc(preVm)}`);
          taskOptions[p.id] = disks.map((d, i) => ({
            value: String(i + 1),
            label: `Disk ${i+1} — ${d.name || `Hard disk ${i+1}`}${d.size_mb ? ` (${Math.round(d.size_mb/1024)} GB)` : ''}`,
          }));
        } else {
          taskOptions[p.id] = [{ value:'', label:'— select a VM first —' }];
        }
      } else if (p.type === 'template-preview') {
        taskOptions[p.id] = null;
      } else if (p.type === 'compute-mode-radio') {
        paramValues[p.id] = 'all_same';
        taskOptions[p.id] = null;
      } else if (p.type === 'per-vm-compute-grid') {
        taskOptions[p.id] = null;
      } else if (p.type === 'vm-multi-select') {
        const vms = await apiFetch('/api/tasks/vms');
        taskOptions[p.id] = vms.map(v => ({ value:v.name, label:v.name, status:v.status||'' }));
        paramValues[p.id] = [];
      } else if (p.type === 'edge-connection-toggle') {
        taskOptions[p.id] = null;
        paramValues['connect_edge_id'] = '';
        paramValues['disconnect_edge'] = 'false';
      } else if (p.type === 'select') {
        taskOptions[p.id] = p.options;
      } else if (p.type === 'text') {
        taskOptions[p.id] = null;  // no options; renders as free-text input
      }
      // Auto-select if single option (skip for allowNone params — user must choose explicitly)
      if (taskOptions[p.id]?.length === 1 && !p.allowNone) {
        paramValues[p.id] = taskOptions[p.id][0].value;
        // If this VM was auto-selected and the task has cpu/memory_gb fields, pre-populate them
        if (p.type === 'vm-select' && task.params.some(q => q.id === 'cpu' || q.id === 'memory_gb')) {
          try {
            const vm = await apiFetch(`/api/tasks/vm?name=${enc(paramValues[p.id])}`);
            if (vm.cpu)       paramValues['cpu']       = String(vm.cpu);
            if (vm.memory_mb) paramValues['memory_gb'] = String(Math.round(vm.memory_mb / 1024));
          } catch (_) {}
        }
      }
    } catch (e) {
      taskOptions[p.id] = [];
    }
  }
  renderParamForm(task);
  // Post-render: populate edge connection toggle if task has one and a network is already selected
  const ecParam = task.params.find(p => p.type === 'edge-connection-toggle');
  if (ecParam) {
    const netParam = task.params.find(p => p.type === 'network-select');
    const netName = netParam ? paramValues[netParam.id] : '';
    if (netName) loadEdgeConnectionToggle(netName);
  }
}

function anyOrTextToggle(paramId, mode) {
  paramValues[paramId] = mode === 'any' ? 'ANY' : '';
  const inp = document.getElementById('aot_' + paramId);
  if (inp) { inp.style.display = mode === 'any' ? 'none' : ''; inp.value = ''; }
}

let _templateSpecMap = {};

async function loadTemplatesForCatalog(catalogName) {
  if (!currentTask) return;
  const tmplParam = currentTask.params.find(p => p.type === 'template-select');
  if (!tmplParam) return;
  const sel = document.getElementById('param_' + tmplParam.id);
  if (!sel) return;
  sel.disabled = true;
  sel.innerHTML = '<option value="">Loading…</option>';
  paramValues[tmplParam.id] = '';
  _templateSpecMap = {};
  const specBox = document.getElementById('templateSpecBox');
  if (specBox) specBox.style.display = 'none';
  try {
    const templates = catalogName
      ? await apiFetch(`/api/tasks/catalog-templates?catalog_name=${enc(catalogName)}`)
      : [];
    templates.forEach(t => { _templateSpecMap[t.name] = t; });
    taskOptions[tmplParam.id] = templates.map(t => ({ value:t.name, label:t.name }));
    sel.disabled = !templates.length;
    sel.innerHTML = `<option value="">— select template —</option>` +
      templates.map(t => `<option value="${escHtml(t.name)}">${escHtml(t.name)}</option>`).join('');
  } catch (_) {
    sel.innerHTML = '<option value="">Failed to load templates</option>';
  }
}

function onTemplateSelect(name) {
  paramValues['template_name'] = name;
  const box = document.getElementById('templateSpecBox');
  if (!box) return;
  if (!name) { box.style.display = 'none'; return; }
  const spec = _templateSpecMap[name];
  if (!spec) { box.style.display = 'none'; return; }
  const parts = [];
  if (spec.cpu)       parts.push(`${spec.cpu} vCPU`);
  if (spec.memory_mb) parts.push(`${Math.round(spec.memory_mb/1024)} GB RAM`);
  box.style.display = '';
  box.textContent = parts.length ? `Template defaults: ${parts.join(' · ')}` : 'Template specs not available from API.';
}

async function loadDisksForVm(vmName) {
  if (!currentTask) return;
  const diskParam = currentTask.params.find(p => p.type === 'disk-select');
  if (!diskParam) return;
  const sel = document.getElementById('param_' + diskParam.id);
  if (!sel) return;
  sel.disabled = true;
  sel.innerHTML = '<option value="">Loading…</option>';
  paramValues[diskParam.id] = '';
  try {
    const disks = vmName ? await apiFetch(`/api/tasks/vm/disks?vm_name=${enc(vmName)}`) : [];
    sel.disabled = !disks.length;
    sel.innerHTML = `<option value="">— select disk —</option>` + disks.map((d, i) => {
      const sizeLabel = d.size_mb ? ` (${Math.round(d.size_mb / 1024)} GB)` : '';
      const name = d.name || `Hard disk ${i + 1}`;
      return `<option value="${i + 1}">Disk ${i + 1} — ${escHtml(name)}${escHtml(sizeLabel)}</option>`;
    }).join('');
  } catch (_) {
    sel.innerHTML = '<option value="">Failed to load disks</option>';
  }

function onVappTargetChange(val) {
  const row = document.getElementById('vmrow_new_vapp_name');
  if (row) row.style.display = val === '__new__' ? '' : 'none';
  if (val !== '__new__') paramValues['new_vapp_name'] = '';
}

function onVmCountChange(count) {
  const n = parseInt(count) || 1;
  for (let i = 2; i <= 5; i++) {
    const row = document.getElementById(`vmrow_vm_name_${i}`);
    if (row) row.style.display = i <= n ? '' : 'none';
    if (i > n) paramValues[`vm_name_${i}`] = '';
  }
  const banner = document.getElementById('multiVmBanner');
  if (banner) banner.style.display = n > 1 ? '' : 'none';
  if (paramValues.compute_mode === 'per_vm') refreshPerVmComputeGrid();
}

function onComputeModeChange(mode) {
  paramValues['compute_mode'] = mode;
  if (!currentTask) return;
  currentTask.params
    .filter(p => p.computeGroup === 'all_same' && p.wrapId)
    .forEach(p => {
      const el = document.getElementById(p.wrapId);
      if (el) el.style.display = mode === 'all_same' ? '' : 'none';
    });
  const pgrid = document.getElementById('perVmComputeGrid');
  if (pgrid) pgrid.style.display = mode === 'per_vm' ? '' : 'none';
  if (mode === 'per_vm') refreshPerVmComputeGrid();
}

        <th style="text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--muted);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em">Disk 1 (GB)</th>

    html += `<tr>
      <td style="padding:5px 8px;border-bottom:1px solid rgba(48,54,61,0.4);color:var(--vcd)">${escHtml(vmName)}</td>
      <td style="padding:5px 8px;border-bottom:1px solid rgba(48,54,61,0.4)"><input type="text" style="${inpStyle}" placeholder="default" value="${escHtml(paramValues[`vm_cpu_${i}`]||'')}" oninput="paramValues['vm_cpu_${i}']=this.value"/></td>
      <td style="padding:5px 8px;border-bottom:1px solid rgba(48,54,61,0.4)"><input type="text" style="${inpStyle}" placeholder="default" value="${escHtml(paramValues[`vm_mem_gb_${i}`]||'')}" oninput="paramValues['vm_mem_gb_${i}']=this.value"/></td>
      <td style="padding:5px 8px;border-bottom:1px solid rgba(48,54,61,0.4)"><input type="text" style="${inpStyle}" placeholder="default" value="${escHtml(paramValues[`vm_disk1_gb_${i}`]||'')}" oninput="paramValues['vm_disk1_gb_${i}']=this.value"/></td>
      <td style="padding:5px 8px;border-bottom:1px solid rgba(48,54,61,0.4)"><input type="text" style="${inpStyle}" placeholder="default" value="${escHtml(paramValues[`vm_disk2_gb_${i}`]||'')}" oninput="paramValues['vm_disk2_gb_${i}']=this.value"/></td>
    </tr>`;
  }
  html += '</tbody></table>';
  grid.innerHTML = html;
}

function toggleVmMultiSelect(name, checked) {
  const arr = paramValues['selected_vms'] || [];
  if (checked) { if (!arr.includes(name)) arr.push(name); }
  else { const i = arr.indexOf(name); if (i >= 0) arr.splice(i, 1); }
  paramValues['selected_vms'] = arr;
  const cnt = document.getElementById('vmMultiCount');
  if (cnt) cnt.textContent = `${arr.length} selected`;
}

function selectAllVmsMulti(select) {
  const list = document.getElementById('vmMultiList');
  if (!list) return;
  list.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.checked = select;
    toggleVmMultiSelect(cb.value, select);
  });
}

function filterVmMultiSelect(q) {
  const list = document.getElementById('vmMultiList');
  if (!list) return;
  const ql = q.toLowerCase();
  list.querySelectorAll('label').forEach(row => {
    const name = row.querySelector('input[type=checkbox]')?.value || '';
    row.style.display = !q || name.toLowerCase().includes(ql) ? '' : 'none';
  });
}

async function loadEdgeConnectionToggle(networkName) {
  const widget = document.getElementById('edgeConnectionWidget');
  if (!widget) return;
  paramValues['connect_edge_id'] = '';
  paramValues['disconnect_edge'] = 'false';
  if (!networkName) {
    widget.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Select a network first.</span>';
    return;
  }
  widget.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Loading…</span>';
  try {
    const [netDetails, gws] = await Promise.all([
      apiFetch(`/api/tasks/network?name=${enc(networkName)}`),
      apiFetch('/api/tasks/edge-gateways'),
    ]);
    const connectedId = netDetails.connected_edge_id || '';
    const gwName = netDetails.connected_edge_name || (gws.find(g => g.id === connectedId)?.name) || connectedId;
    if (connectedId) {
      paramValues['connect_edge_id'] = '';
      paramValues['disconnect_edge'] = 'false';
      widget.innerHTML = `
        <div style="font-size:0.78rem;margin-bottom:8px">
          Currently connected to <strong>${escHtml(gwName)}</strong>.
        </div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.82rem">
          <input type="checkbox" onchange="paramValues['disconnect_edge']=this.checked?'true':'false'" />
          Isolate — disconnect from edge gateway
        </label>`;
    } else {
      const gwOpts = `<option value="">— keep isolated —</option>` +
        gws.map(g => `<option value="${escHtml(g.id)}">${escHtml(g.name)} [${escHtml(g.backing_type||'NSX-T')}]</option>`).join('');
      paramValues['connect_edge_id'] = '';
      paramValues['disconnect_edge'] = 'false';
      widget.innerHTML = `
        <div style="font-size:0.78rem;color:var(--muted);margin-bottom:8px">
          Currently isolated — not connected to an edge gateway.
        </div>
        <select onchange="paramValues['connect_edge_id']=this.value">
          ${gwOpts}
        </select>`;
    }
  } catch (_) {
    widget.innerHTML = '<span style="color:var(--fail);font-size:0.8rem">Failed to load connection status.</span>';
  }
}

async function loadVmComputeDefaults(vmName) {
  if (!vmName) return;
  try {
    const vm = await apiFetch(`/api/tasks/vm?name=${enc(vmName)}`);
    if (vm.cpu) {
      paramValues['cpu'] = String(vm.cpu);
      const el = document.getElementById('param_text_cpu');
      if (el) el.value = vm.cpu;
    }
    if (vm.memory_mb) {
      const gb = Math.round(vm.memory_mb / 1024);
      paramValues['memory_gb'] = String(gb);
      const el = document.getElementById('param_text_memory_gb');
      if (el) el.value = gb;
    }
  } catch (_) {}
}


function renderParamForm(task) {
  const form = document.getElementById('paramForm');
  let html = '';
  for (const p of task.params) {
    if (p.type === 'multi-vm-banner') {
      html += `<div id="multiVmBanner" style="display:none;flex-basis:100%;width:100%;margin-bottom:4px;padding:10px 14px;border-radius:6px;background:rgba(248,81,73,0.10);border:1px solid rgba(248,81,73,0.35);color:var(--text);font-size:0.8rem;">
        <strong>⚠ Multi-VM deploy:</strong> If a VM fails mid-deploy, partial resources may remain in the vApp.
        Monitor progress in the VCD UI and remove any failed VMs manually if needed.
      </div>`;
      continue;
    }

    if (p.type === 'template-preview') {
      html += `<div id="templateSpecBox" style="display:none;flex-basis:100%;width:100%;padding:8px 12px;border-radius:6px;background:rgba(88,166,255,0.07);border:1px solid rgba(88,166,255,0.2);font-size:0.78rem;color:var(--vcd);margin-bottom:2px"></div>`;
      continue;
    }

    if (p.type === 'compute-mode-radio') {
      html += `<div class="param-field" style="flex-basis:100%;width:100%">
        <label>${p.label}</label>
        <div style="display:flex;gap:20px;margin-top:6px;font-size:0.82rem">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="radio" name="compute_mode_radio" value="all_same" ${paramValues[p.id]!=='per_vm'?'checked':''}
                   onchange="onComputeModeChange('all_same')" /> Same for all VMs
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="radio" name="compute_mode_radio" value="per_vm" ${paramValues[p.id]==='per_vm'?'checked':''}
                   onchange="onComputeModeChange('per_vm')" /> Different per VM
          </label>
        </div>
      </div>`;
      continue;
    }

    if (p.type === 'per-vm-compute-grid') {
      html += `<div id="perVmComputeGrid" style="display:none;flex-basis:100%;width:100%;margin-bottom:8px"></div>`;
      continue;
    }

    if (p.type === 'vm-multi-select') {
      const vms = taskOptions[p.id] || [];
      const btnStyle = 'background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-size:0.72rem;padding:3px 10px';
      html += `<div class="param-field" style="min-width:100%;flex-basis:100%;width:100%">
        <label>${p.label}</label>
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
          <input type="text" placeholder="Filter VMs…" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 8px;font-size:0.78rem;outline:none" oninput="filterVmMultiSelect(this.value)" />
          <button onclick="selectAllVmsMulti(true)" style="${btnStyle}">All</button>
          <button onclick="selectAllVmsMulti(false)" style="${btnStyle}">None</button>
        </div>
        <div id="vmMultiList" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface2)">
          ${vms.map(v => {
            const s = (v.status||'').toUpperCase();
            const col = s==='POWERED_ON'?'var(--ok)':s==='POWERED_OFF'?'var(--fail)':'var(--muted)';
            return `<label style="display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,0.4)">
              <input type="checkbox" value="${escHtml(v.value)}" onchange="toggleVmMultiSelect('${escHtml(v.value)}',this.checked)" />
              <span style="flex:1;font-size:0.8rem">${escHtml(v.value)}</span>
              <span style="font-size:0.65rem;color:${col}">${escHtml(v.status||'?')}</span>
            </label>`;
          }).join('')}
        </div>
        <div id="vmMultiCount" style="font-size:0.72rem;color:var(--muted);margin-top:4px">0 selected</div>
      </div>`;
      continue;
    }

    if (p.type === 'edge-connection-toggle') {
      html += `<div class="param-field">
        <label>${p.label || 'Edge Gateway Connection'}</label>
        <div id="edgeConnectionWidget"><span style="color:var(--muted);font-size:0.8rem">Select a network first.</span></div>
      </div>`;
      continue;
    }

    // Determine wrapper attributes for dynamically shown/hidden fields
    const wrapId    = p.wrapId    ? `id="${p.wrapId}"` : '';
    const wrapStyle = p.wrapHidden ? 'style="display:none"' : '';

    if (p.type === 'any-or-text') {
      const isAny = !paramValues[p.id] || paramValues[p.id] === 'ANY';
      html += `<div class="param-field" ${wrapId} ${wrapStyle}>
        <label>${p.label}</label>
        <select onchange="anyOrTextToggle('${p.id}', this.value)">
          <option value="any" ${isAny?'selected':''}>Any</option>
          <option value="custom" ${!isAny?'selected':''}>Specific IPs / CIDRs</option>
        </select>
        <input id="aot_${p.id}" type="text" placeholder="${p.placeholder||'e.g. 10.0.0.0/8, 192.168.1.5'}"
               style="margin-top:6px;${isAny?'display:none':''}"
               value="${escHtml(!isAny ? (paramValues[p.id]||'') : '')}"
               oninput="paramValues['${p.id}']=this.value" />
      </div>`;
      if (isAny) paramValues[p.id] = 'ANY';
    } else if (p.type === 'text') {
      const extraInput = /^vm_name_\d+$/.test(p.id) ? "; if(paramValues.compute_mode==='per_vm') refreshPerVmComputeGrid()" : '';
      html += `<div class="param-field" ${wrapId} ${wrapStyle}>
        <label>${p.label}</label>
        <input id="param_text_${p.id}" type="text" placeholder="${p.placeholder || ''}"
               value="${escHtml(paramValues[p.id] || '')}"
               oninput="paramValues['${p.id}']=this.value${extraInput}" />
      </div>`;
    } else {
      const opts = taskOptions[p.id] || [];
      const noAutoCollapse = p.type === 'vm-select';
      const auto = opts.length === 1 && paramValues[p.id] && !p.allowNone && !noAutoCollapse;
      if (auto) {
        html += `<div class="param-auto" ${wrapId} ${wrapStyle}>
          <div class="param-lbl">${p.label}</div>
          <div class="param-val">${opts[0].label}</div>
        </div>`;
      } else {
        const onChange = p.type === 'catalog-select'
          ? `paramValues['${p.id}']=this.value; loadTemplatesForCatalog(this.value)`
          : (p.type === 'vm-select' && task.params.some(q => q.type === 'disk-select'))
          ? `paramValues['${p.id}']=this.value; loadDisksForVm(this.value)`
          : (p.type === 'vm-select' && task.params.some(q => q.id === 'cpu' || q.id === 'memory_gb'))
          ? `paramValues['${p.id}']=this.value; loadVmComputeDefaults(this.value)`
          : p.type === 'vapp-or-new-select'
          ? `paramValues['${p.id}']=this.value; onVappTargetChange(this.value)`
          : p.type === 'vm-count-select'
          ? `paramValues['${p.id}']=this.value; onVmCountChange(this.value)`
          : p.type === 'template-select'
          ? `paramValues['${p.id}']=this.value; onTemplateSelect(this.value)`
          : (p.type === 'network-select' && task.params.some(q => q.type === 'edge-connection-toggle'))
          ? `paramValues['${p.id}']=this.value; loadEdgeConnectionToggle(this.value)`
          : `paramValues['${p.id}']=this.value`;
        html += `<div class="param-field" ${wrapId} ${wrapStyle}>
          <label>${p.label}</label>
          <select id="param_${p.id}" onchange="${onChange}" ${!opts.length?'disabled':''}>
            <option value="">— select —</option>
            ${opts.map(o=>`<option value="${o.value}" ${paramValues[p.id]===o.value?'selected':''}>${o.label}</option>`).join('')}
          </select>
        </div>`;
      }
    }
  }
  const dangerClass = task.confirm ? 'danger' : '';
  html += `<button class="run-btn ${dangerClass}" onclick="runTask()">${task.confirm ? '⚠ ' : ''}Run</button>`;
  form.innerHTML = html;
}

// ── Run task ───────────────────────────────────────────────────────────────
async function runTask() {
  if (!currentTask) return;

  for (const p of currentTask.params) {
    if (p.optional) continue;
    if (!paramValues[p.id] && paramValues[p.id] !== false) {
      showResultError(`Please fill in "${p.label}" before running.`);
      return;
    }
  }

  if (currentTask.validate) {
    const err = currentTask.validate(paramValues);
    if (err) { showResultError(err); return; }
  }

  if (currentTask.confirm) {
    const msg = currentTask.confirmMsg
      ? currentTask.confirmMsg(paramValues)
      : `Are you sure you want to run "${currentTask.label}"? This will affect live infrastructure.`;
    const ok = await showConfirm(currentTask.label, msg);
    if (!ok) return;
  }

  document.getElementById('confirmOverlay').classList.add('hidden');
  showResultLoading();

  try {
    const data = await currentTask.run(paramValues);
    const html  = currentTask.render(data);
    const count = Array.isArray(data) ? `${data.length} result${data.length!==1?'s':''}` : '';
    const exportBtn = (currentTask.exportable && Array.isArray(data) && data.length > 0)
      ? `<button class="btn-export-csv" onclick="exportTableAsCsv('${currentTask.label.replace(/'/g, "\\'")}')">⬇ Export CSV</button>`
      : '';
    document.getElementById('resultArea').innerHTML =
      (count || exportBtn ? `<div class="result-meta">${count}${exportBtn}</div>` : '') + html;
  } catch (e) {
    showResultError(e.message);
  }
}

function showResultLoading() {
  document.getElementById('resultArea').innerHTML =
    '<div class="result-loading"><div class="spinner"></div><span>Loading…</span></div>';
}

function showResultError(msg) {
  document.getElementById('resultArea').innerHTML =
    `<div class="result-error">❌ ${escHtml(msg)}</div>`;
}

function exportTableAsCsv(title) {
  const table = document.querySelector('#resultArea .result-table');
  if (!table) return;
  const rows = [];
  rows.push([...table.querySelectorAll('thead th')].map(th => th.textContent.trim()));
  table.querySelectorAll('tbody tr').forEach(tr => {
    rows.push([...tr.querySelectorAll('td')].map(td => td.textContent.trim()));
  });
  const csv = '﻿' + rows.map(row =>
    row.map(cell => {
      const s = cell.replace(/"/g, '""');
      return /[",\n\r]/.test(s) ? `"${s}"` : s;
    }).join(',')
  ).join('\r\n');
  const org = sessionStorage.getItem('vcd_org') || '';
  const vdc = sessionStorage.getItem('vcd_vdc_name') || '';
  const filename = [title, org, vdc, new Date().toISOString().slice(0,10)]
    .filter(Boolean).join('_').replace(/\s+/g, '-') + '.csv';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.style.display = 'none';
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Render helpers ─────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function spill(status) {
  const s = String(status||'').toUpperCase();
  const cls = (s==='POWERED_ON'||s==='REALIZED') ? 'spill-on' : s==='POWERED_OFF' ? 'spill-off' : 'spill-mid';
  return `<span class="spill ${cls}">${escHtml(String(status||'—'))}</span>`;
}

function renderTable(headers, rows) {
  if (!rows.length) return '<div class="empty-result">No results found.</div>';
  return `<table class="result-table">
    <thead><tr>${headers.map(h=>`<th>${escHtml(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell??'—'}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function renderOk(msg) {
  return `<div class="result-ok">✓ ${escHtml(msg)}</div>`;
}

function renderVmTable(vms) {
  return renderTable(
    ['Name','Status','CPU','RAM',''],
    vms.map(v => {
      const powered = (v.status||'').toUpperCase() === 'POWERED_ON';
      const btn = `<button class="btn-console" ${powered?'':'disabled'} onclick="openVmConsole('${escHtml(v.name).replace(/'/g,"\\'")}')" title="${powered?'Open console':'VM must be powered on'}">Console</button>`;
      return [escHtml(v.name), spill(v.status), v.cpu??'—', v.memory_mb ? Math.round(v.memory_mb/1024)+' GB' : '—', btn];
    })
  );
}

async function openVmConsole(vmName) {
  try {
    const data = await apiFetch(`/api/tasks/vm/console?vm_name=${enc(vmName)}`);
    if (data.url) {
      window.open(data.url, '_blank', 'width=1100,height=768,noopener,noreferrer');
    }
  } catch(e) {
    alert('Console error: ' + (e.detail || e.message));
  }
}

function renderVmDetail(vm) {
  const ram = vm.memory_mb ? Math.round(vm.memory_mb/1024)+' GB' : '—';
  const dv = (v) => `<div class="detail-val">${escHtml(String(v||'—'))}</div>`;
  const di = (k,v) => v ? `<div class="detail-item"><div class="detail-key">${k}</div>${dv(v)}</div>` : '';

  let html = `<div class="detail-card">
    <div class="detail-title">${escHtml(vm.name)} ${spill(vm.status)}</div>

    <div class="detail-section">Compute</div>
    <div class="detail-grid">
      ${di('vCPU', vm.cpu ? vm.cpu+' vCPU' : null)}
      ${di('RAM', ram)}
      ${di('vApp', vm.vapp_name)}
      ${di('Storage Profile', vm.storage_profile)}
    </div>

    <div class="detail-section">Operating System</div>
    <div class="detail-grid">
      ${di('Guest OS', vm.guest_os)}
      ${di('Detected OS', vm.detected_os)}
      ${di('VM Tools', vm.tools_status)}
    </div>`;

  if (vm.nics?.length) {
    html += `<div class="detail-section">Network Interfaces (${vm.nics.length})</div>`;
    html += renderTable(
      ['#','Network','IP Address','MAC','Mode','Adapter','Link'],
      vm.nics.map((n,i) => [
        (n.primary ? '★ ' : '') + (i+1),
        escHtml(n.network||'—'),
        escHtml(n.ip||'—'),
        escHtml(n.mac||'—'),
        escHtml((n.mode||'').replace(/_/g,' ')),
        escHtml(n.adapter||'—'),
        n.connected === true  ? '<span style="color:var(--ok)">Connected</span>'
          : n.connected === false ? '<span style="color:var(--fail)">Disconnected</span>'
          : '<span style="color:var(--muted)">—</span>',
      ])
    );
  } else if (vm.ip_address || vm.network_name) {
    // Fallback: show basic IP/network from adminVM query when full NIC details unavailable
    html += `<div class="detail-section">Network (basic)</div>
    <div class="detail-grid">
      ${di('Network', vm.network_name)}
      ${di('IP Address', vm.ip_address)}
    </div>`;
  }

  if (vm.disks?.length) {
    html += `<div class="detail-section">Disks (${vm.disks.length})</div>`;
    html += renderTable(
      ['Name','Size','Bus / Adapter','Storage Profile'],
      vm.disks.map(d => [
        escHtml(d.name||'—'),
        d.size_mb ? (d.size_mb >= 1024 ? Math.round(d.size_mb/1024)+' GB' : d.size_mb+' MB') : '—',
        escHtml(d.bus_type||'—'),
        escHtml(d.storage_profile||'—'),
      ])
    );
  }

  html += '</div>';
  return html;
}

function renderVappTable(vapps) {
  return renderTable(['Name','Status'], vapps.map(v => [escHtml(v.name), spill(v.status)]));
}

function renderVappDetail(vapp) {
  let html = `<div class="detail-card">
    <div class="detail-title">${escHtml(vapp.name)} ${spill(vapp.status)}</div>`;

  if (vapp.networks?.length) {
    html += `<div class="detail-section">Networks (${vapp.networks.length})</div>`;
    html += renderTable(
      ['Name', 'Type', 'Gateway', 'Netmask', 'DNS'],
      vapp.networks.map(n => [
        escHtml(n.name || '—'),
        escHtml(n.type || '—'),
        escHtml(n.gateway || '—'),
        escHtml(n.netmask || '—'),
        [n.dns1, n.dns2].filter(Boolean).join(', ') || '—',
      ])
    );
  }

  if (vapp.vms?.length) {
    html += `<div class="detail-section">VMs (${vapp.vms.length})</div>` + renderVmTable(vapp.vms);
  } else {
    html += '<div class="empty-result">No VMs found inside this vApp.</div>';
  }
  html += '</div>';
  return html;
}

function renderNetworkDetail(net) {
  let html = `<div class="detail-card">
    <div class="detail-title">${escHtml(net.name)}</div>
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-key">Type</div><div class="detail-val">${escHtml(net.type||'—')}</div></div>
      <div class="detail-item"><div class="detail-key">Gateway</div><div class="detail-val">${escHtml(net.gateway||'—')}/${net.prefix_length||'—'}</div></div>
    </div>`;
  for (const s of (net.subnets_detail||[])) {
    const dns1 = s.dnsServer1||s.dns1;
    const dns2 = s.dnsServer2||s.dns2;
    if (dns1||dns2) {
      html += `<div class="detail-grid">`;
      if (dns1) html += `<div class="detail-item"><div class="detail-key">DNS 1</div><div class="detail-val">${escHtml(dns1)}</div></div>`;
      if (dns2) html += `<div class="detail-item"><div class="detail-key">DNS 2</div><div class="detail-val">${escHtml(dns2)}</div></div>`;
      html += `</div>`;
    }
    const pools = (s.ipRanges||{}).values||[];
    if (pools.length) {
      html += `<div class="detail-section">DHCP Pools</div>`;
      html += renderTable(['Start','End'], pools.map(p=>[escHtml(p.startAddress||''), escHtml(p.endAddress||'')]));
    }
  }
  html += '</div>';
  return html;
}
